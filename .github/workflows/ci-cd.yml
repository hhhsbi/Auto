# CI/CD 流水线 —— AutoResearch
# 触发：push 到 main / PR 到 main；手动 workflow_dispatch
# 阶段：lint(test) → build & push 镜像到 GHCR → SSH 部署到服务器
#
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 配置：
#   DEPLOY_SSH_KEY     服务器 SSH 私钥（私钥内容，不带 passphrase 或加 --pwd）
#   DEPLOY_HOST        服务器 IP 或域名
#   DEPLOY_USER        SSH 登录用户
#   DEPLOY_PATH        服务器上项目路径（docker-compose.yml 所在目录）
#   DEEPSEEK_API_KEY   DeepSeek API Key（写入服务器 .env）
#   JWT_SECRET         生产 JWT 密钥（≥32 字节随机串）
# 镜像无需配 secret：GHCR 用自动 GITHUB_TOKEN，权限在 workflow 末尾 permissions 块授予

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/autoresearch

jobs:
  # ───────── Job 1：测试 ─────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Compile check（语法兜底）
        run: python -m compileall -q app.py main.py rag.py cache.py auth.py ingest.py audit.py tracing.py

      - name: Run pytest
        env:
          DEEPSEEK_API_KEY: test-key-not-real
        run: pytest tests/ -v --tb=short

  # ───────── Job 2：构建并推镜像到 GHCR ─────────
  build-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    # PR 只构建不推送；main 分支才推镜像
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build（PR 期验证构建，不推）
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push（main 分支）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────── Job 3：SSH 部署到服务器 ─────────
  deploy:
    name: Deploy to Server
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # 写入/更新 .env（密钥只在服务器落盘，不入 git）
            cat > .env <<EOF
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            REDIS_HOST=redis
            REDIS_PORT=6379
            ENABLE_WEB_SEARCH=false
            EOF

            # 登录 GHCR 拉镜像（用部署专用 PAT，或用 docker login）
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 拉最新镜像并重启
            docker compose pull
            docker compose up -d --remove-orphans

            # 健康检查：最多重试 30 次
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8000/health >/dev/null; then
                echo "健康检查通过"
                docker compose ps
                exit 0
              fi
              sleep 5
            done
            echo "健康检查失败" >&2
            docker compose logs --tail=100 app
            exit 1
